# yardo catalog: the Containers & Kubernetes tab (Docker, Podman and
# registry logins are in 10-system.toml, installed with the system).
# `legacy` steps run the bundled bash installer until the item is ported.

# The everyday Kubernetes CLIs. With zsh, oh-my-zsh's kubectl plugin
# brings its aliases (kgp, kdp, kl, kaf, kgs, kgd, …) once kubectl is on
# PATH, and the kubectx and helm plugins their completions.
[[item]]
id = "k8s"
tab = "k8s"
label = "Kubernetes: kubectl (+ zsh aliases kgp, kdp, kl, …), kubectx/kubens, helm, k9s, stern, k3d"
source = "mise use -g kubectl kubectx kubens helm@3 k9s stern k3d · aliases: oh-my-zsh's kubectl plugin (zsh) · k3d runs clusters in Docker"

[[item.step]]
type = "mise"
tools = ["kubectl@latest", "kubectx@latest", "kubens@latest", "helm@3", "k9s@latest", "stern@latest", "k3d@latest"]

# Everything else, for platform work: one item.
[[item]]
id = "k8stools"
remove = "rm -rf {{home}}/.local/share/helm/plugins/helm-diff {{home}}/.krew"
remove_say = "removes the Kubernetes extras, helm-diff, and krew with its plugins"
tab = "k8s"
label = "Kubernetes extras (kustomize, helmfile, kubeconform, kubelogin, krew, Argo CD, Flux, Tilt, Skaffold, kind, talosctl, …)"
needs = ["k8s"]
source = "mise use -g kustomize helmfile kubeconform kubelogin kubie kubecolor argocd flux2 tilt skaffold ctlptl kind talosctl · helm-diff · krew + neat, tree, view-secret"

[[item.step]]
type = "mise"
tools = ["kustomize@latest", "helmfile@latest", "kubeconform@latest", "kubelogin@latest", "kubie@latest", "kubecolor@latest", "argocd@latest", "flux2@latest", "tilt@latest", "skaffold@latest", "ctlptl@latest", "kind@latest", "talosctl@latest"]

[[item.step]]
type = "run"
cmd = "helm plugin install https://github.com/databus23/helm-diff"
as_user = true
check = "helm plugin list | grep -q '^diff'"

[[item.step]]
type = "run"
cmd = 't=$(mktemp -d) && curl -fsSL https://github.com/kubernetes-sigs/krew/releases/latest/download/krew-linux_{{arch}}.tar.gz | tar -xzf - -C "$t" && "$t/krew-linux_{{arch}}" install krew; rc=$?; rm -rf "$t"; exit $rc'
as_user = true
creates = "~/.krew/bin/kubectl-krew"
unverified = "krew's latest release; krew then checks each plugin's sha256 from its index"

[[item.step]]
type = "line"
to = "~/.zshenv"
line = 'export PATH="$HOME/.krew/bin:$PATH"'

[[item.step]]
type = "line"
to = "~/.bashrc"
line = 'export PATH="$HOME/.krew/bin:$PATH"'
top = true

[[item.step]]
type = "run"
cmd = 'PATH="$HOME/.krew/bin:$PATH" kubectl krew install neat tree view-secret'
as_user = true
check = 'l=$(PATH="$HOME/.krew/bin:$PATH" kubectl krew list) && for p in neat tree view-secret; do printf "%s\n" "$l" | grep -qx "$p" || exit 1; done'
