# yardo catalog: the Git & SSH tab (Configure): git itself, the git hosts
# (GitHub, GitLab, Bitbucket) and how this machine reaches them, dotfiles.
# `legacy` steps run the bundled bash installer until the item is ported.

[[item]]
id = "gitid"
tab = "git"
label = "Git name and email"
default = true
needs = ["essentials"]
source = "git config --global user.name/email"

[[item.step]]
type = "git_config"
values = { "user.name" = "{{git_name}}", "user.email" = "{{git_email}}", "init.defaultBranch" = "main" }

[[item]]
id = "gitcfg"
tab = "git"
label = "Git defaults (rebase pulls, auto upstream, delta diffs)"
default = true
needs = ["essentials"]
source = "git config --global · aliases st co br sw lg amend · global ignores in ~/.config/git/ignore"

[[item.step]]
type = "git_config"

[item.step.values]
"pull.rebase" = "true"
"rebase.autoStash" = "true"
"rebase.autoSquash" = "true"
"rebase.updateRefs" = "true"
"push.autoSetupRemote" = "true"
"push.default" = "current"
"fetch.prune" = "true"
"rerere.enabled" = "true"
"merge.conflictStyle" = "zdiff3"
"diff.algorithm" = "histogram"
"diff.colorMoved" = "default"
"branch.sort" = "-committerdate"
"column.ui" = "auto"
"commit.verbose" = "true"
"init.defaultBranch" = "main"
"core.excludesFile" = "~/.config/git/ignore"
"alias.st" = "status -sb"
"alias.co" = "checkout"
"alias.br" = "branch"
"alias.sw" = "switch"
"alias.lg" = "log --graph --oneline --decorate --all"
"alias.amend" = "commit --amend --no-edit"

# delta's diffs, when it is installed (CLI upgrades).
[[item.step]]
type = "git_config"
if_tool = "delta"

[item.step.values]
"core.pager" = "delta"
"interactive.diffFilter" = "delta --color-only"
"delta.navigate" = "true"
"delta.line-numbers" = "true"

# Global ignores: yardo's defaults as a block it keeps up to date, first in
# the file; your own lines go below it and are kept.
[[item.step]]
type = "block"
src = "gitignore_global"
to = "~/.config/git/ignore"

# SSH for the git hosts, as each host item's mode says: the key sent from
# your machine with `ssh <host> 'sudo yardo gitkey' < <key>` (a deploy key,
# or your account's; one is made here when none was sent), which
# ~/.ssh/config points every connection to those hosts at, so it works for
# any repo it may reach; ~/.ssh/id_ed25519 made here (GitLab, Bitbucket;
# GitHub's is made and uploaded by its login); host keys.
[[item]]
id = "gitkey"
tab = "-"
phase = "configure"
label = "SSH for the git hosts"
source = "~/.ssh/yardo_git_key or ~/.ssh/id_ed25519 · ~/.ssh/config · host keys"

[[item.step]]
type = "go:gitkey"

[[item]]
id = "github"
tab = "git"
label = "GitHub: gh login + SSH key for git"
default = true
needs = ["essentials", "gitkey"]
source = "gh auth login · git over SSH: forwarded agent, a key made here (gh ssh-key add) or one you send (yardo gitkey); or a token"

[[item.step]]
type = "legacy"

[[item]]
id = "gitlab"
tab = "git"
label = "GitLab: SSH key for git"
needs = ["gitkey"]
source = "git over SSH: forwarded agent, a key made here or one you send (yardo gitkey) · gitlab.com or your own"

[[item]]
id = "bitbucket"
tab = "git"
label = "Bitbucket: SSH key for git"
needs = ["gitkey"]
source = "git over SSH: forwarded agent, a key made here or one you send (yardo gitkey) · bitbucket.org"

[[item]]
id = "gitsign"
tab = "git"
label = "Sign commits with SSH"
needs = ["github"]
source = "git gpg.format=ssh · signing key on GitHub · ~/.config/git/allowed_signers"

[[item.step]]
type = "legacy"

# Your own dotfiles, applied last so they win: cloned (or pulled) on every
# run, then the repo's install script, or stow.
[[item]]
id = "dotfiles"
tab = "git"
label = "Your dotfiles repo (~/.dotfiles: its install script, or stow)"
last = true
source = "git clone/pull · install.sh, bootstrap.sh or setup.sh, else stow each directory · runs last"

[[item.step]]
type = "apt"
packages = ["git", "stow"]

[[item.step]]
type = "go:dotfiles"
