# yardo catalog: the Git & SSH tab (Configure): git itself, the git hosts
# (GitHub, GitLab, Bitbucket) and how this machine reaches them, dotfiles.
# `legacy` steps run the bundled bash installer until the item is ported.

[[item]]
id = "gitid"
remove_say = "unsets the git settings yardo made, where they're still its own, and removes lazygit"
tab = "git"
label = "Git: name, email, your SSH key and defaults (rebase pulls, auto upstream, delta diffs, aliases), lazygit"
default = true
needs = ["essentials", "gitkey"]
source = "git config --global user.name/email and defaults · SSH for your git hosts (~/.ssh/config.d/yardo-git) · aliases st co br sw lg amend · global ignores in ~/.config/git/ignore · mise use -g lazygit"

# lazygit, the git TUI.
[[item.step]]
type = "mise"
tools = ["lazygit@latest"]

[[item.step]]
type = "git_config"
values = { "user.name" = "{{git_name}}", "user.email" = "{{git_email}}", "init.defaultBranch" = "main" }

# Defaults: rebasing pulls, pushes that set their upstream, aliases.
[[item.step]]
type = "git_config"

[item.step.values]
"pull.rebase" = "true"
"rebase.autoStash" = "true"
"rebase.autoSquash" = "true"
"rebase.updateRefs" = "true"
"push.autoSetupRemote" = "true"
"push.default" = "current"
"fetch.prune" = "true"
"rerere.enabled" = "true"
"merge.conflictStyle" = "zdiff3"
"diff.algorithm" = "histogram"
"diff.colorMoved" = "default"
"branch.sort" = "-committerdate"
"column.ui" = "auto"
"commit.verbose" = "true"
"init.defaultBranch" = "main"
"core.excludesFile" = "~/.config/git/ignore"
"alias.st" = "status -sb"
"alias.co" = "checkout"
"alias.br" = "branch"
"alias.sw" = "switch"
"alias.lg" = "log --graph --oneline --decorate --all"
"alias.amend" = "commit --amend --no-edit"

# delta's diffs, when it is installed (CLI upgrades).
[[item.step]]
type = "git_config"
if_tool = "delta"

[item.step.values]
"core.pager" = "delta"
"interactive.diffFilter" = "delta --color-only"
"delta.navigate" = "true"
"delta.line-numbers" = "true"

# Global ignores: yardo's defaults as a block it keeps up to date, first in
# the file; your own lines go below it and are kept.
[[item.step]]
type = "block"
src = "gitignore_global"
to = "~/.config/git/ignore"

# SSH for git: each git host's key, chosen when it's added (made or pasted
# in ~/.ssh/identities/<host>, one of yours under ~/.ssh, or none: a
# forwarded agent), or sent with `ssh <host> 'sudo yardo gitkey <host>' <
# <key>`; machines set up before keep theirs (~/.ssh/id_ed25519, made when
# you have no key; ~/.ssh/<host>; ~/.ssh/yardo_git_key). Its settings are
# in ~/.ssh/config.d/yardo-git, included at the top of ~/.ssh/config (a
# host your config sets is left to you), its defaults (Settings › Accept
# new hosts' SSH keys) in ~/.ssh/config.d/yardo-defaults, included at the
# end; GitHub's and Bitbucket's host keys pinned.
[[item]]
id = "gitkey"
tab = "-"
phase = "configure"
label = "SSH for git"
source = "each host's key (~/.ssh/identities/<host>, or yours) · ~/.ssh/config.d/yardo-git, included by ~/.ssh/config · GitHub's and Bitbucket's host keys"

[[item.step]]
type = "go:gitkey"

# GitHub: gh (with the essentials), act, GitHub's host keys and git over
# your SSH key. Logging in is yours: gh auth login, when you want it.
[[item]]
id = "github"
tab = "git"
label = "GitHub: act (run Actions locally), git over the SSH key you pick; gh auth login is yours"
needs = ["essentials", "gitkey"]
source = "gh (essentials) · its SSH key: made, yours, pasted or none · GitHub's host keys in ~/.ssh/known_hosts · mise act (needs Docker to run) · log in yourself: gh auth login"

[[item.step]]
type = "note"
text = "GitHub: log gh in when you want it: gh auth login (git over SSH uses the key picked for GitHub; add its .pub at https://github.com/settings/keys)."
when = "! runuser -u {{user}} -- gh auth status -h github.com >/dev/null 2>&1"

[[item.step]]
type = "mise"
tools = ["act@latest"]

[[item]]
id = "gitlab"
tab = "git"
label = "GitLab: SSH key for git, glab (GitLab CLI)"
needs = ["gitkey"]
source = "git over SSH: its key made, yours, pasted or sent (yardo gitkey gitlab), or a forwarded agent · gitlab.com or your own"

[[item.step]]
type = "mise"
tools = ["glab@latest"]

[[item]]
id = "bitbucket"
tab = "git"
label = "Bitbucket: SSH key for git"
needs = ["gitkey"]
source = "git over SSH at ssh.bitbucket.org (bitbucket.org remotes too): its key made, yours, pasted or sent (yardo gitkey bitbucket), or a forwarded agent · host keys pinned"

[[item]]
id = "gitsign"
keep_say = "signing is in your git config: git config --global --unset commit.gpgsign turns it off"
tab = "git"
label = "Sign commits with SSH"
needs = ["github"]
source = "git gpg.format=ssh · signing key on GitHub · ~/.config/git/allowed_signers"

[[item.step]]
type = "legacy"

# Your own dotfiles, applied last so they win: cloned (or pulled) on every
# run, then the repo's install script, or stow.
[[item]]
id = "dotfiles"
keep_say = "it's your own repo, linked into your home; yardo doesn't unlink it"
tab = "git"
label = "Your dotfiles repo (~/.dotfiles: its install script, or stow)"
last = true
source = "git clone/pull · install.sh, bootstrap.sh or setup.sh, else stow each directory · runs last"

[[item.step]]
type = "apt"
packages = ["git", "stow"]

[[item.step]]
type = "go:dotfiles"
