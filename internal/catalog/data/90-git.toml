# yardo catalog: the Git & SSH tab (Configure): git itself, the git hosts
# (GitHub, GitLab, Bitbucket) and how this machine reaches them, dotfiles.
# `legacy` steps run the bundled bash installer until the item is ported.

[[item]]
id = "gitid"
remove_say = "unsets the git settings yardo made, where they're still its own, and removes lazygit"
tab = "git"
label = "Git: name, email, your SSH key and defaults (rebase pulls, auto upstream, delta diffs, aliases), lazygit"
default = true
needs = ["essentials", "gitkey"]
source = "git config --global user.name/email and defaults · ~/.ssh/id_ed25519 made when you have no key · aliases st co br sw lg amend · global ignores in ~/.config/git/ignore · mise use -g lazygit"

# lazygit, the git TUI.
[[item.step]]
type = "mise"
tools = ["lazygit@latest"]

[[item.step]]
type = "git_config"
values = { "user.name" = "{{git_name}}", "user.email" = "{{git_email}}", "init.defaultBranch" = "main" }

# Defaults: rebasing pulls, pushes that set their upstream, aliases.
[[item.step]]
type = "git_config"

[item.step.values]
"pull.rebase" = "true"
"rebase.autoStash" = "true"
"rebase.autoSquash" = "true"
"rebase.updateRefs" = "true"
"push.autoSetupRemote" = "true"
"push.default" = "current"
"fetch.prune" = "true"
"rerere.enabled" = "true"
"merge.conflictStyle" = "zdiff3"
"diff.algorithm" = "histogram"
"diff.colorMoved" = "default"
"branch.sort" = "-committerdate"
"column.ui" = "auto"
"commit.verbose" = "true"
"init.defaultBranch" = "main"
"core.excludesFile" = "~/.config/git/ignore"
"alias.st" = "status -sb"
"alias.co" = "checkout"
"alias.br" = "branch"
"alias.sw" = "switch"
"alias.lg" = "log --graph --oneline --decorate --all"
"alias.amend" = "commit --amend --no-edit"

# delta's diffs, when it is installed (CLI upgrades).
[[item.step]]
type = "git_config"
if_tool = "delta"

[item.step.values]
"core.pager" = "delta"
"interactive.diffFilter" = "delta --color-only"
"delta.navigate" = "true"
"delta.line-numbers" = "true"

# Global ignores: yardo's defaults as a block it keeps up to date, first in
# the file; your own lines go below it and are kept.
[[item.step]]
type = "block"
src = "gitignore_global"
to = "~/.config/git/ignore"

# SSH for git: your own key (~/.ssh/id_ed25519, made when you have none),
# which ssh uses for every host by itself. Machines set up with a way per
# host keep it, as each host item's mode says: the key sent from
# your machine with `ssh <host> 'sudo yardo gitkey' < <key>` (a deploy key,
# or your account's; one is made here when none was sent), which
# ~/.ssh/config points every connection to those hosts at, so it works for
# any repo it may reach; a key made here named for its host (~/.ssh/gitlab,
# ~/.ssh/bitbucket; GitHub's ~/.ssh/github is made and uploaded by its
# login), which ~/.ssh/config points the host at; host keys.
[[item]]
id = "gitkey"
tab = "-"
phase = "configure"
label = "SSH for git"
source = "~/.ssh/id_ed25519 (or ~/.ssh/yardo_git_key, ~/.ssh/github, gitlab, bitbucket) · ~/.ssh/config · host keys"

[[item.step]]
type = "go:gitkey"

# GitHub: gh (with the essentials), act, GitHub's host keys and git over
# your SSH key. Logging in is yours: gh auth login, when you want it.
[[item]]
id = "github"
tab = "git"
label = "GitHub: act (run Actions locally), git over your SSH key; gh auth login is yours"
needs = ["essentials", "gitkey"]
source = "gh (essentials) · GitHub's host keys in ~/.ssh/known_hosts · mise act (needs Docker to run) · log in yourself: gh auth login"

[[item.step]]
type = "note"
text = "GitHub: log gh in when you want it: gh auth login (git over SSH uses ~/.ssh/id_ed25519; add its .pub at https://github.com/settings/keys)."
when = "! runuser -u {{user}} -- gh auth status -h github.com >/dev/null 2>&1"

[[item.step]]
type = "mise"
tools = ["act@latest"]

[[item]]
id = "gitlab"
tab = "git"
label = "GitLab: SSH key for git, glab (GitLab CLI)"
needs = ["gitkey"]
source = "git over SSH: forwarded agent, a key made here or one you send (yardo gitkey) · gitlab.com or your own"

[[item.step]]
type = "mise"
tools = ["glab@latest"]

[[item]]
id = "bitbucket"
tab = "git"
label = "Bitbucket: SSH key for git"
needs = ["gitkey"]
source = "git over SSH: forwarded agent, a key made here or one you send (yardo gitkey) · bitbucket.org"

[[item]]
id = "gitsign"
keep_say = "signing is in your git config: git config --global --unset commit.gpgsign turns it off"
tab = "git"
label = "Sign commits with SSH"
needs = ["github"]
source = "git gpg.format=ssh · signing key on GitHub · ~/.config/git/allowed_signers"

[[item.step]]
type = "legacy"

# Your own dotfiles, applied last so they win: cloned (or pulled) on every
# run, then the repo's install script, or stow.
[[item]]
id = "dotfiles"
keep_say = "it's your own repo, linked into your home; yardo doesn't unlink it"
tab = "git"
label = "Your dotfiles repo (~/.dotfiles: its install script, or stow)"
last = true
source = "git clone/pull · install.sh, bootstrap.sh or setup.sh, else stow each directory · runs last"

[[item.step]]
type = "apt"
packages = ["git", "stow"]

[[item.step]]
type = "go:dotfiles"
