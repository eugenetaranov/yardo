# The picker's tabs, in order: the install screen's, then the configure
# screen's (phase = "configure"; Review comes last on its own). The plan
# installs everything first, then configures.
#
# Tabs with the same group show as one picker tab, named after the group,
# each under its own heading: the Dev, DevOps, AI and System tabs. Items
# still name the tab (the section) they're in.

[[tab]]
id = "lang"
title = "Languages"
group = "Dev"

[[tab]]
id = "dev"
title = "Dev tools"
group = "Dev"

[[tab]]
id = "k8s"
title = "Containers & Kubernetes"
group = "DevOps"

[[tab]]
id = "iac"
title = "IaC"
group = "DevOps"

[[tab]]
id = "cloud"
title = "Cloud"
group = "DevOps"

[[tab]]
id = "ai"
title = "Coding agents"
group = "AI"

# What the agents use: specs, agent packs, an MCP gateway, local models.
[[tab]]
id = "aiext"
title = "Add-ons & models"
group = "AI"

[[tab]]
id = "shell"
title = "Shell & CLI"

[[tab]]
id = "system"
title = "System"
group = "System"

# VPNs and mesh networks: this machine reaching others, and others it.
[[tab]]
id = "net"
title = "Connectivity"
group = "System"

# Machine settings: the visible ones are who can connect to Docker's
# ports and API; the rest are always on (baseline every machine gets).
[[tab]]
id = "sysconf"
title = "Who can connect"
phase = "configure"

[[tab]]
id = "git"
title = "Git & SSH"
phase = "configure"

[[tab]]
id = "agents"
title = "Agents"
phase = "configure"

[[tab]]
id = "logins"
title = "VPN logins"
phase = "configure"
