# The picker's tabs, in order: the install screen's, then the configure
# screen's (phase = "configure"; Review comes last on its own). The plan
# installs everything first, then configures.
#
# Tabs with the same group show as one picker tab, named after the group,
# each under its own heading: the Dev, DevOps, AI and System tabs. Items
# still name the tab (the section) they're in.

[[tab]]
id = "lang"
title = "Languages"
group = "Dev"

[[tab]]
id = "dev"
title = "Dev tools"
group = "Dev"

[[tab]]
id = "k8s"
title = "Containers & Kubernetes"
group = "DevOps"

[[tab]]
id = "iac"
title = "IaC"
group = "DevOps"

[[tab]]
id = "cloud"
title = "Cloud"
group = "DevOps"

[[tab]]
id = "ai"
title = "Coding agents"
group = "AI"

# What the agents use: specs, agent packs, an MCP gateway, local models.
[[tab]]
id = "aiext"
title = "Add-ons & models"
group = "AI"

[[tab]]
id = "shell"
title = "Shell & CLI"

[[tab]]
id = "system"
title = "System"
group = "System"

# VPNs and mesh networks: this machine reaching others, and others it.
[[tab]]
id = "net"
title = "Connectivity"
group = "System"

# Machine settings: the visible ones are who can connect to Docker's
# ports and API; the rest are always on (baseline every machine gets).
[[tab]]
id = "sysconf"
title = "Who can connect"
phase = "configure"

[[tab]]
id = "git"
title = "Git & SSH"
phase = "configure"

[[tab]]
id = "agents"
title = "Agent setup"
phase = "configure"

[[tab]]
id = "logins"
title = "VPN logins"
phase = "configure"

# The first run's choices, in order, after the prompt (Powerlevel10k or
# Starship, a setting). Every other item the picker offers is either in
# the base (default = true: installed without asking) or on the Tools
# screen only. Each answer is a set of items; picks stay item by item.

[[choice]]
id = "lang"
title = "Languages"
note = "Python, Node.js and Go"
kind = "toggle"
items = ["python", "node", "go"]
on = ["on"]

[[choice]]
id = "docker"
title = "Docker"
note = "and the MCP gateway, which runs in it"
kind = "toggle"
items = ["docker", "docker-ports", "mcpjungle-install", "mcpjungle"]
on = ["on"]

[[choice]]
id = "k8s"
title = "Kubernetes tools"
note = "kubectl and its aliases, helm, k9s, kustomize, …"
kind = "toggle"
items = ["k8s", "k8stools"]

[[choice]]
id = "iac"
title = "Terraform tools"
note = "Terraform, OpenTofu, Packer, Ansible, …"
kind = "toggle"
items = ["terraform", "opentofu", "packer", "ansible", "tack", "vault"]

[[choice]]
id = "cloud"
title = "Cloud providers"
kind = "multi"
items = ["aws", "doctl", "hcloud", "cloudflared", "gcloud", "azure"]
note = "the Google Cloud and Azure CLIs are large"

[[choice]]
id = "agents"
title = "Coding agents"
kind = "multi"
items = ["claude", "codex", "gemini", "opencode", "aider", "goose", "omp", "agentkeys"]
on = ["claude"]

[[choice]]
id = "githost"
title = "Git hosts"
kind = "multi"
items = ["github", "gitlab", "bitbucket"]
on = ["github"]

[[choice]]
id = "vpn"
title = "VPN or mesh network"
kind = "one"

[[choice.option]]
id = "tailscale"
title = "Tailscale"
items = ["tailscale-install", "tailscale"]

[[choice.option]]
id = "netbird"
title = "NetBird"
items = ["netbird-install", "netbird"]

[[choice.option]]
id = "openvpn"
title = "OpenVPN client"
items = ["openvpn-client"]

[[choice.option]]
id = "wireguard"
title = "WireGuard client"
items = ["wireguard-client"]
