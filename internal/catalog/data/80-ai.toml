# yardo catalog: the AI tab.
# `legacy` steps run the bundled bash installer until the item is ported.

[[item]]
id = "claude"
tab = "ai"
label = "Claude Code"
default = true
source = "apt claude-code (Anthropic repo)"

[[item.step]]
type = "apt"
packages = ["curl", "gnupg", "ca-certificates"]

[[item.step]]
type = "apt_repo"
name = "claude-code"
key_url = "https://downloads.claude.ai/keys/claude-code.asc"
key_fingerprint = "31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE"
source = """
Types: deb
URIs: https://downloads.claude.ai/claude-code/apt/latest
Suites: latest
Components: main
Signed-By: {{keyring}}
"""

[[item.step]]
type = "apt"
packages = ["claude-code"]

[[item]]
id = "codex"
tab = "ai"
label = "OpenAI Codex CLI"

[[item.step]]
type = "mise"
tools = ["codex@latest"]

[[item]]
id = "gemini"
tab = "ai"
label = "Gemini CLI"
# node-pty builds from source: make and a compiler.
needs = ["node", "essentials"]

[[item.step]]
type = "mise"
tools = ["gemini@latest"]

[[item]]
id = "opencode"
tab = "ai"
label = "OpenCode"

[[item.step]]
type = "mise"
tools = ["opencode@latest"]

[[item]]
id = "aider"
tab = "ai"
label = "Aider"

[[item.step]]
type = "mise"
tools = ["uv@latest", "pipx:aider-chat[uvx_args=--python=3.12]"]

[[item]]
id = "goose"
tab = "ai"
label = "Goose"

[[item.step]]
type = "mise"
tools = ["aqua:block/goose@latest"]

[[item]]
id = "omp"
tab = "ai"
label = "omp (oh-my-pi coding agent)"
source = "curl omp.sh/install → /usr/local/bin/omp"

[[item.step]]
type = "run"
cmd = "curl -fsSL https://omp.sh/install | PI_INSTALL_DIR=/usr/local/bin sh -s -- --binary"
creates = "/usr/local/bin/omp"
unverified = "omp's own installer, which fetches its latest release"

[[item]]
id = "ollama"
tab = "aiext"
scope = "system"
label = "Ollama (local models; large, CPU-only without GPU passthrough)"
source = "curl ollama.com/install.sh · listens on 127.0.0.1:11434"

# The installer's unit listens on 127.0.0.1:11434; it stays that way.
[[item.step]]
type = "run"
cmd = "curl -fsSL https://ollama.com/install.sh | sh"
check = "command -v ollama"
unverified = "ollama's own installer, which fetches its latest release"

[[item.step]]
type = "note"
text = "ollama: no GPU found, so models run on the CPU (slow for anything big)."
when = "! lspci 2>/dev/null | grep -qiE 'nvidia|amd/ati'"

[[item]]
id = "openspec"
tab = "aiext"
label = "OpenSpec (spec-driven development CLI)"
default = true
needs = ["node"]

[[item.step]]
type = "mise"
tools = ["npm:@fission-ai/openspec@latest"]

[[item]]
id = "ecc"
tab = "aiext"
label = "ECC for Claude Code (~68 agents, rules, commands; no hooks)"
needs = ["node", "claude"]
source = "npx ecc-universal@2.2.3 install --profile minimal · npx ecc-universal uninstall to remove"

[[item.step]]
type = "run"
cmd = "npx --yes ecc-universal@2.2.3 install --target claude --profile minimal"
as_user = true
check = "grep -q '\"repoVersion\": \"2.2.3\"' ~/.claude/ecc/install-state.json"

[[item]]
id = "agentcfg"
tab = "agents"
after = ["claude", "codex"]
label = "Agent notes and safety settings for this VM"
default = true
source = "notes: ~/.claude/CLAUDE.md, ~/.codex/AGENTS.md (only if absent) · ~/.claude/settings.json deny rules: no sudo, force-push or reading SSH keys and tokens · ~/.codex/config.toml sandbox"

[[item.step]]
type = "file"
src = "agent-notes.md"
to = "~/.claude/CLAUDE.md"
if_absent = true

[[item.step]]
type = "file"
src = "agent-notes.md"
to = "~/.codex/AGENTS.md"
if_absent = true

# Guard rails for unattended agents, merged into their own settings.
[[item.step]]
type = "go:agentsafe"

# Skills every agent reads (agentskills.io; ~/.agents/skills and
# ~/.claude/skills), and no agent's name on commits.
[[item]]
id = "agentskills"
tab = "agents"
after = ["agentcfg"]
label = "Agent skills: git commits, PR descriptions, Jira tickets; no agent co-author lines"
default = true
source = "~/.agents/skills, ~/.claude/skills (Claude Code, Codex, Gemini CLI, OpenCode, Goose, omp) · a git commit-msg hook (Git 2.54+; older git on Ubuntu upgraded from the git-core PPA) dropping agents' Co-authored-by"

[[item.step]]
type = "go:skills"
skills = ["git-commits", "pr-descriptions", "jira-tickets"]

[[item.step]]
type = "go:gitattrib"

[[item.step]]
type = "note"
text = "Codex adds 'Co-authored-by: Codex' when your ChatGPT account says so, whatever its instructions say: turn commit attribution off in your ChatGPT account's Codex settings (yardo's git hook drops it from local commits)."
when = "[ -d {{home}}/.codex ]"

# Community skills, vendored at pinned commits with their licences
# (internal/assets/skills.lock.toml; updated with scripts/update-skills).
[[item]]
id = "communityskills"
tab = "agents"
after = ["agentcfg"]
label = "Community skills: debugging, verify before done, TDD, grill me, find bugs, humanizer, skill creator, webapp testing"
source = "obra/superpowers systematic-debugging, verification-before-completion (MIT) · mattpocock/skills tdd, grill-me (MIT) · getsentry/skills find-bugs (Apache-2.0) · blader/humanizer (MIT) · anthropics/skills skill-creator, webapp-testing (Apache-2.0) · to ~/.agents/skills, ~/.claude/skills"

[[item.step]]
type = "go:skills"
skills = ["systematic-debugging", "verification-before-completion", "tdd", "grill-me", "find-bugs", "humanizer", "skill-creator", "webapp-testing"]

[[item]]
id = "agentkeys"
tab = "agents"
label = "Agent API keys (Anthropic, OpenAI, Gemini)"
source = "~/.config/yardo/agent.env (0600) · read by interactive shells"

[[item.step]]
type = "cred"
format = "env"
to = "~/.config/yardo/agent.env"
header = """
# Agent API keys, written by yardo and read by interactive shells.
# Fill in a key, then open a new shell. Not shared with services or cron.
"""

[[item.step.key]]
name = "ANTHROPIC_API_KEY"
prompt = "Anthropic API key (empty: log in with 'claude' instead)"
how = "https://console.anthropic.com/settings/keys"
when = "claude"
logged_in = "~/.claude/.credentials.json"

[[item.step.key]]
name = "OPENAI_API_KEY"
prompt = "OpenAI API key (Codex)"
how = "https://platform.openai.com/api-keys"
when = "codex"
logged_in = "~/.codex/auth.json"

[[item.step.key]]
name = "GEMINI_API_KEY"
prompt = "Gemini API key"
how = "https://aistudio.google.com/apikey"
when = "gemini"
logged_in = "~/.gemini/oauth_creds.json"

# Exported by interactive shells only.
[[item.step]]
type = "file"
src = "agent-env.sh"
to = "~/.config/yardo/agent-env.sh"

[[item.step]]
type = "line"
to = "~/.bashrc"
line = '[ -r ~/.config/yardo/agent-env.sh ] && . ~/.config/yardo/agent-env.sh'

[[item.step]]
type = "line"
to = "~/.zshrc"
line = '[ -r ~/.config/yardo/agent-env.sh ] && . ~/.config/yardo/agent-env.sh'
if_exists = true

[[item]]
id = "mcpjungle-install"
tab = "aiext"
label = "MCPJungle MCP gateway (runs in Docker; its servers: MCP servers, on the menu)"
default = true
needs = ["docker"]
source = "release binary · systemd mcpjungle@<user> as mcp-<user>"

[[item.step]]
type = "apt"
packages = ["curl", "jq", "tar", "acl"]

[[item.step]]
type = "run"
cmd = """
case {{arch}} in
  amd64) r=x86_64 s=64e0ad1f4c24457e925f1c535648b2a8779946868b8813a5cdbc8f4ed85cec65 ;;
  arm64) r=arm64 s=6312c574c998ab373bdb921d78aa4ff5a07c56709b5839a60487e656fe89e2e9 ;;
  *) echo "mcpjungle has no release for {{arch}}" >&2; exit 1 ;;
esac
t=$(mktemp)
curl -fsSL -o "$t" "https://github.com/mcpjungle/MCPJungle/releases/download/0.4.6/mcpjungle_Linux_$r.tar.gz" &&
  echo "$s  $t" | sha256sum -c --quiet &&
  tar -xzf "$t" -C /usr/local/bin mcpjungle && chmod 0755 /usr/local/bin/mcpjungle
rc=$?; rm -f "$t"; exit $rc
"""
creates = "/usr/local/bin/mcpjungle"

# The server catalog (/usr/local/share/mcp-catalog) and mcp-sync.
[[item.step]]
type = "go:mcp_files"

# The gateway runs as mcp-<user>, which owns ~/.mcp: an agent running as
# the login user can't read the MCP tokens without sudo.
[[item.step]]
type = "go:mcp_user"

[[item.step]]
type = "go:mcpjungle_unit"

[[item.step]]
type = "go:mcp_wait"

# Beyond this machine, tokens: the admin's (for mcp-sync) and the agents'.
[[item.step]]
type = "go:mcp_auth"

# VPN only: the port only from this machine and the VPN interfaces.
[[item.step]]
type = "go:mcp_firewall"

# On the internet: Caddy, HTTPS at the user's domain name, and fail2ban.
[[item.step]]
type = "go:mcp_public"

# The servers, and the agents wired to the gateway. Keeps the old id, so an
# old pick still means install + servers.
[[item]]
id = "mcpjungle"
tab = "agents"
label = "MCP servers on MCPJungle, added to your agents"
default = true
needs = ["mcpjungle-install"]
source = "~/.mcp/<server>/env (0600) · mcp-sync · Claude Code, Codex, Gemini CLI, OpenCode, Goose"

# Each picked server's ~/.mcp/<name>/env (0600): its skeleton, with the
# keys typed this run.
[[item.step]]
type = "go:mcp_servers"

[[item.step]]
type = "go:mcp_wire"

[[item.step]]
type = "go:mcp_sync"
