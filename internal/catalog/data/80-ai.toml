# yardo catalog: the AI tab.
# `legacy` steps run the bundled bash installer until the item is ported.

[[item]]
id = "claude"
tab = "ai"
label = "Claude Code"
source = "apt claude-code (Anthropic repo)"

[[item.step]]
type = "apt"
packages = ["curl", "gnupg", "ca-certificates"]

[[item.step]]
type = "apt_repo"
name = "claude-code"
key_url = "https://downloads.claude.ai/keys/claude-code.asc"
key_fingerprint = "31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE"
source = """
Types: deb
URIs: https://downloads.claude.ai/claude-code/apt/latest
Suites: latest
Components: main
Signed-By: {{keyring}}
"""

[[item.step]]
type = "apt"
packages = ["claude-code"]

[[item]]
id = "codex"
tab = "ai"
label = "OpenAI Codex CLI"

[[item.step]]
type = "mise"
tools = ["codex@latest"]

[[item]]
id = "gemini"
tab = "ai"
label = "Gemini CLI"
# node-pty builds from source: make and a compiler.
needs = ["node", "essentials"]

[[item.step]]
type = "mise"
tools = ["gemini@latest"]

[[item]]
id = "opencode"
tab = "ai"
label = "OpenCode"

[[item.step]]
type = "mise"
tools = ["opencode@latest"]

[[item]]
id = "aider"
tab = "ai"
label = "Aider"

[[item.step]]
type = "mise"
tools = ["uv@latest", "pipx:aider-chat[uvx_args=--python=3.12]"]

[[item]]
id = "goose"
tab = "ai"
label = "Goose"

[[item.step]]
type = "mise"
tools = ["aqua:block/goose@latest"]

[[item]]
id = "omp"
remove = "rm -f /usr/local/bin/omp"
remove_say = "deletes /usr/local/bin/omp; its settings in your home stay"
tab = "ai"
label = "omp (oh-my-pi coding agent)"
source = "curl omp.sh/install → /usr/local/bin/omp"

[[item.step]]
type = "run"
cmd = "curl -fsSL https://omp.sh/install | PI_INSTALL_DIR=/usr/local/bin sh -s -- --binary"
creates = "/usr/local/bin/omp"
unverified = "omp's own installer, which fetches its latest release"

[[item]]
id = "ollama"
remove = """
systemctl disable --now ollama 2>/dev/null || true
rm -f /etc/systemd/system/ollama.service /usr/local/bin/ollama /usr/bin/ollama
rm -rf /usr/local/lib/ollama /usr/lib/ollama
systemctl daemon-reload
"""
remove_say = "stops Ollama and uninstalls it; the models in /usr/share/ollama stay"
tab = "aiext"
scope = "system"
label = "Ollama (local models; large, CPU-only without GPU passthrough)"
source = "curl ollama.com/install.sh · listens on 127.0.0.1:11434"

# The installer's unit listens on 127.0.0.1:11434; it stays that way.
[[item.step]]
type = "run"
cmd = "curl -fsSL https://ollama.com/install.sh | sh"
check = "command -v ollama"
unverified = "ollama's own installer, which fetches its latest release"

[[item.step]]
type = "note"
text = "ollama: no GPU found, so models run on the CPU (slow for anything big)."
when = "! lspci 2>/dev/null | grep -qiE 'nvidia|amd/ati'"

[[item]]
id = "openspec"
tab = "aiext"
label = "OpenSpec (spec-driven development CLI)"
default = true
needs = ["node"]

[[item.step]]
type = "mise"
tools = ["npm:@fission-ai/openspec@latest"]

[[item]]
id = "ecc"
keep_say = "ECC's files sit among yours in ~/.claude; ~/.claude/ecc/install-state.json lists them"
tab = "aiext"
label = "ECC for Claude Code (~68 agents, rules, commands; no hooks)"
needs = ["node", "claude"]
source = "npx ecc-universal@2.2.3 install --profile minimal · npx ecc-universal uninstall to remove"

[[item.step]]
type = "run"
cmd = "npx --yes ecc-universal@2.2.3 install --target claude --profile minimal"
as_user = true
check = "grep -q '\"repoVersion\": \"2.2.3\"' ~/.claude/ecc/install-state.json"

[[item]]
id = "agentcfg"
keep_say = "its settings are mixed with yours in ~/.claude and ~/.codex: edit them there"
tab = "agents"
after = ["claude", "codex"]
label = "Agent notes and safety settings for this VM"
default = true
source = "notes: ~/.claude/CLAUDE.md, ~/.codex/AGENTS.md (only if absent) · ~/.claude/settings.json deny rules: no sudo, force-push or reading SSH keys and tokens · ~/.codex/config.toml sandbox"

[[item.step]]
type = "file"
src = "agent-notes.md"
to = "~/.claude/CLAUDE.md"
if_absent = true

[[item.step]]
type = "file"
src = "agent-notes.md"
to = "~/.codex/AGENTS.md"
if_absent = true

# Guard rails for unattended agents, merged into their own settings.
[[item.step]]
type = "go:agentsafe"

# Skills every agent reads (agentskills.io; ~/.agents/skills and
# ~/.claude/skills).
[[item]]
id = "agentskills"
tab = "agents"
after = ["agentcfg"]
label = "Agent skills: git commits and branches, PR descriptions, Jira tickets"
default = true
source = "~/.agents/skills, ~/.claude/skills (Claude Code, Codex, Gemini CLI, OpenCode, Goose, omp)"

[[item.step]]
type = "go:skills"
skills = ["git-commits", "git-branches", "pr-descriptions", "jira-tickets"]

# No coding agent's name on a commit, on every machine: not offered, so
# not unticked or removed.
[[item]]
id = "noagentattrib"
tab = "agents"
always = true
after = ["claude", "codex", "agentcfg", "agentskills"]
label = "No agent co-author lines on commits"
source = "a global git commit-msg hook (Git 2.54+; older git on Ubuntu upgraded from the git-core PPA) dropping any coding agent's Co-authored-by and Generated-with lines · Claude Code's commit and PR attribution off"

[[item.step]]
type = "go:gitattrib"

[[item.step]]
type = "note"
text = "Codex adds 'Co-authored-by: Codex' when your ChatGPT account says so, whatever its instructions say: turn commit attribution off in your ChatGPT account's Codex settings (yardo's git hook drops it from local commits)."
when = "[ -d {{home}}/.codex ]"

# Community skills, vendored at pinned commits with their licences
# (internal/assets/skills.lock.toml; updated with scripts/update-skills).
[[item]]
id = "communityskills"
tab = "agents"
after = ["agentcfg"]
label = "Community skills: debugging, verify before done, TDD, grill me, find bugs, humanizer, skill creator, webapp testing"
source = "obra/superpowers systematic-debugging, verification-before-completion (MIT) · mattpocock/skills tdd, grill-me (MIT) · getsentry/skills find-bugs (Apache-2.0) · blader/humanizer (MIT) · anthropics/skills skill-creator, webapp-testing (Apache-2.0) · to ~/.agents/skills, ~/.claude/skills"

[[item.step]]
type = "go:skills"
skills = ["systematic-debugging", "verification-before-completion", "tdd", "grill-me", "find-bugs", "humanizer", "skill-creator", "webapp-testing"]

# ~/pages over HTTP: the pages agents make (diagrams, reports), opened on
# your laptop. Reached as the MCP gateway is (Settings › MCP gateway and web
# pages): this machine only (an SSH tunnel), the VPNs, the internet under
# the gateway's domain (/pages/, with a password) or everywhere.
[[item]]
id = "pages"
tab = "agents"
after = ["agentcfg", "mcpjungle-install"]
label = "Web pages from your agents: ~/pages at a link you open on your laptop"
remove_say = "stops serving ~/pages; the pages themselves stay"
source = "apt caddy (its own repository) · caddy file-server as you (yardo-pages@you) on port 9080, a file list at / · pages-url NAME prints the link (the address your SSH session came in at) · skill pages: agents save HTML there and give you the link"

[[item.step]]
type = "go:pages_unit"

[[item.step]]
type = "go:pages_firewall"

[[item.step]]
type = "go:pages_public"

[[item.step]]
type = "go:skills"
skills = ["pages"]

# Archify: an agent turns a plan, system or repo into an interactive HTML
# diagram or explainer, saved in ~/pages. Too big to ship inside yardo
# (23 MB): the skills step downloads its folder at the commit in
# skills.lock.toml and installs it only if its hash matches. Its scripts
# run on Node.
[[item]]
id = "archify"
tab = "agents"
needs = ["pages", "node"]
after = ["claude", "codex"]
label = "Archify: interactive diagrams of a plan, system or repo (open them from ~/pages)"
remove_say = "removes the archify skill; diagrams in ~/pages stay"
source = "tt-a1i/archify's archify folder (Apache-2.0) at a pinned commit, its hash checked (skills.lock.toml) → ~/.claude/skills, ~/.agents/skills"

[[item.step]]
type = "go:skills"
skills = ["archify"]

[[item]]
id = "agentkeys"
remove_say = "takes your agent keys out of your shells; the file with them (~/.config/yardo/agent.env) stays"
tab = "agents"
label = "Agent API keys (Anthropic, OpenAI, Gemini)"
source = "~/.config/yardo/agent.env (0600) · read by interactive shells"

[[item.step]]
type = "cred"
format = "env"
to = "~/.config/yardo/agent.env"
header = """
# Agent API keys, written by yardo and read by interactive shells.
# Fill in a key, then open a new shell. Not shared with services or cron.
"""

[[item.step.key]]
name = "ANTHROPIC_API_KEY"
prompt = "Anthropic API key (empty: log in with 'claude' instead)"
how = "https://console.anthropic.com/settings/keys"
when = "claude"
optional = true

[[item.step.key]]
name = "OPENAI_API_KEY"
prompt = "OpenAI API key (Codex)"
how = "https://platform.openai.com/api-keys"
when = "codex"
optional = true

[[item.step.key]]
name = "GEMINI_API_KEY"
prompt = "Gemini API key"
how = "https://aistudio.google.com/apikey"
when = "gemini"
optional = true

# Exported by interactive shells only.
[[item.step]]
type = "file"
src = "agent-env.sh"
to = "~/.config/yardo/agent-env.sh"

[[item.step]]
type = "line"
to = "~/.bashrc"
line = '[ -r ~/.config/yardo/agent-env.sh ] && . ~/.config/yardo/agent-env.sh'

[[item.step]]
type = "go:zshdropin"
line = '[ -r ~/.config/yardo/agent-env.sh ] && . ~/.config/yardo/agent-env.sh'

[[item]]
id = "mcpjungle-install"
remove = """
systemctl disable --now 'mcpjungle@{{user}}' 2>/dev/null || true
# The binary goes once no one else's gateway runs.
if ! systemctl list-units 'mcpjungle@*' --all --no-legend 2>/dev/null | grep -q active; then rm -f /usr/local/bin/mcpjungle; fi
"""
remove_say = "stops your MCP gateway and removes it; your servers' settings in ~/.mcp stay"
tab = "aiext"
label = "MCPJungle MCP gateway (runs in Docker; its servers: MCP servers, on the menu)"
needs = ["docker"]
source = "release binary · systemd mcpjungle@<user> as mcp-<user>"

[[item.step]]
type = "apt"
packages = ["curl", "jq", "tar", "acl"]

[[item.step]]
type = "run"
cmd = """
case {{arch}} in
  amd64) r=x86_64 s=64e0ad1f4c24457e925f1c535648b2a8779946868b8813a5cdbc8f4ed85cec65 ;;
  arm64) r=arm64 s=6312c574c998ab373bdb921d78aa4ff5a07c56709b5839a60487e656fe89e2e9 ;;
  *) echo "mcpjungle has no release for {{arch}}" >&2; exit 1 ;;
esac
t=$(mktemp)
curl -fsSL -o "$t" "https://github.com/mcpjungle/MCPJungle/releases/download/0.4.6/mcpjungle_Linux_$r.tar.gz" &&
  echo "$s  $t" | sha256sum -c --quiet &&
  tar -xzf "$t" -C /usr/local/bin mcpjungle && chmod 0755 /usr/local/bin/mcpjungle
rc=$?; rm -f "$t"; exit $rc
"""
creates = "/usr/local/bin/mcpjungle"

# The server catalog (/usr/local/share/mcp-catalog) and mcp-sync.
[[item.step]]
type = "go:mcp_files"

# The gateway runs as mcp-<user>, which owns ~/.mcp: an agent running as
# the login user can't read the MCP tokens without sudo.
[[item.step]]
type = "go:mcp_user"

[[item.step]]
type = "go:mcpjungle_unit"

[[item.step]]
type = "go:mcp_wait"

# Beyond this machine, tokens: the admin's (for mcp-sync) and the agents'.
[[item.step]]
type = "go:mcp_auth"

# VPN only: the port only from this machine and the VPN interfaces.
[[item.step]]
type = "go:mcp_firewall"

# On the internet: Caddy, HTTPS at the user's domain name, and fail2ban.
[[item.step]]
type = "go:mcp_public"

# The servers, and the agents wired to the gateway. Keeps the old id, so an
# old pick still means install + servers.
[[item]]
id = "mcpjungle"
part_of = "mcpjungle-install"
keep_say = "its servers are yours to add and delete: Manage MCP servers, in the gateway's details"
tab = "agents"
label = "MCP servers on MCPJungle, added to your agents"
needs = ["mcpjungle-install"]
source = "~/.mcp/<server>/env (0600) · mcp-sync · Claude Code, Codex, Gemini CLI, OpenCode, Goose"

# Each picked server's ~/.mcp/<name>/env (0600): its skeleton, with the
# keys typed this run.
[[item.step]]
type = "go:mcp_servers"

[[item.step]]
type = "go:mcp_wire"

[[item.step]]
type = "go:mcp_sync"

# skill-veil: the offline scanner the add-on checks run on a skill or MCP
# spec from elsewhere (as nobody, no network, no home). Added when the
# first one is added; nothing runs it otherwise.
[[item]]
id = "skillveil"
tab = "-"
label = "skill-veil (scans skills and MCP specs from elsewhere, offline)"
source = "release binary (seifreed/skill-veil, MIT), pinned and checked"
remove = "rm -f /usr/local/bin/skill-veil"
remove_say = "removes the scanner; adding a skill or server from elsewhere installs it again"

[[item.step]]
type = "apt"
packages = ["curl", "tar"]

[[item.step]]
type = "run"
cmd = """
case {{arch}} in
  amd64) r=x86_64 s=6a6167ea71ba63e565448c1fc21d1a698315de4cfa0c90604970da393c5a4f26 ;;
  arm64) r=arm64 s=f64aec53b281c0ed46cd8b68abe05d8ff09ac3508622c30a74054b65c51f0342 ;;
  *) echo "skill-veil has no release for {{arch}}" >&2; exit 1 ;;
esac
t=$(mktemp) d=$(mktemp -d)
curl -fsSL -o "$t" "https://github.com/seifreed/skill-veil/releases/download/v0.3.0/skill-veil-linux-$r.tar.gz" &&
  echo "$s  $t" | sha256sum -c --quiet &&
  tar -xzf "$t" -C "$d" &&
  install -m 0755 "$d/skill-veil-linux-$r/skill-veil" /usr/local/bin/skill-veil
rc=$?; rm -rf "$t" "$d"; exit $rc
"""
check = "/usr/local/bin/skill-veil --version 2>/dev/null | grep -qw 0.3.0"
