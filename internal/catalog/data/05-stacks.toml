# Where you're headed: on the first run, before the picker, yardo asks
# what you work with, on two tabs, Dev and DevOps; tick on both for a mix
# (a Java dev with Terraform and Kubernetes, a DevOps engineer with
# Python). Each stack ticks its items on top of the defaults; the picker
# then opens with them ticked, all still editable.

[[stack]]
id = "java"
group = "dev"
label = "Java / Kotlin"
items = ["java"]

[[stack]]
id = "python"
group = "dev"
label = "Python"
items = ["python"]

