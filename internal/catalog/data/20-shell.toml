# yardo catalog: the Shell & CLI tab. zsh is one item; the hidden items
# below it are its parts.

# One opinionated zsh: the login shell, oh-my-zsh with its plugins,
# fzf-tab, the modern CLI tools and aliases it relies on, man pages; the
# prompt is asked (Powerlevel10k or Starship).
[[item]]
id = "zsh"
tab = "shell"
label = "zsh, ready to use (asks: Powerlevel10k or Starship prompt)"
needs = ["zshbin", "zshcfg", "prompt", "zshrc", "fzftab", "shellcfg", "cli", "docs"]
source = "oh-my-zsh + autosuggestions, syntax highlighting, history search, fzf-tab · ripgrep fd bat eza fzf zoxide delta direnv · z, fzf keys, aliases · man pages, tldr"

# The one editor: Neovim with a curated config, comfortable without
# knowing its plugins (which-key lists the keys).
[[item]]
id = "neovim"
tab = "shell"
label = "Neovim, ready to use (fuzzy find, file browser, LSP, completion)"
# After the languages: their servers are installed with it.
after = ["go", "python", "node", "java", "rust", "terraform", "docker", "k8s"]
source = "mise neovim@latest node@lts · lazy.nvim · curated ~/.config/nvim/init.lua (.orig kept) · which-key, telescope, oil, gitsigns, sleuth, mini, mason + SchemaStore, blink.cmp"

[[item.step]]
type = "mise"
tools = ["neovim@latest", "node@lts"]

# git clones the plugins; ripgrep backs the text search; Mason unpacks
# servers with unzip; bash-language-server lints with shellcheck.
[[item.step]]
type = "apt"
packages = ["git", "ripgrep", "unzip", "curl", "shellcheck"]

[[item.step]]
type = "file"
src = "nvim-init.lua"
to = "~/.config/nvim/init.lua"
keep_orig = true

# EDITOR, and `sudo nvim FILE` through sudoedit (sudo's PATH has no mise).
[[item.step]]
type = "file"
src = "nvim.sh"
to = "~/.config/yardo/nvim.sh"

[[item.step]]
type = "line"
to = "~/.bashrc"
line = '[ -r ~/.config/yardo/nvim.sh ] && . ~/.config/yardo/nvim.sh'

[[item.step]]
type = "line"
to = "~/.zshrc"
line = '[ -r ~/.config/yardo/nvim.sh ] && . ~/.config/yardo/nvim.sh'
if_exists = true

[[item.step]]
type = "run"
cmd = "nvim --headless '+Lazy! sync' +qa </dev/null || true"
as_user = true
creates = "~/.local/share/nvim/lazy/lazy.nvim"
unverified = "lazy.nvim and the plugins install from their git repos (lazy.nvim from its stable branch); they have no release files to pin"

# The language servers for JSON, YAML, shell and the installed languages
# (the list is in init.lua). Checked again on every run: a language
# added later gets its server.
[[item.step]]
type = "run"
cmd = "nvim --headless +YardoServers +qa </dev/null && nvim --headless '+YardoServers check' </dev/null"
as_user = true
check = "test -d ~/.local/share/nvim/lazy/mason.nvim && nvim --headless '+YardoServers check' </dev/null"
unverified = "Mason installs the language servers from npm and their GitHub releases, latest versions"

[[item]]
id = "tmux"
tab = "shell"
source = "apt tmux · ~/.tmux.conf (.tmux.conf.orig kept)"
label = "tmux (mouse, splits, 50k history)"

[[item.step]]
type = "apt"
packages = ["tmux"]

[[item.step]]
type = "file"
src = "tmux.conf"
to = "~/.tmux.conf"
keep_orig = true

[[item]]
id = "zellij"
tab = "shell"
label = "zellij (tmux alternative)"

[[item.step]]
type = "mise"
tools = ["zellij@latest"]

[[item]]
id = "mosh"
tab = "shell"
label = "mosh (SSH that survives sleep and roaming)"

[[item.step]]
type = "apt"
packages = ["mosh"]

[[item]]
id = "zshbin"
tab = "-"
label = "zsh (login shell)"
source = "apt zsh · chsh to zsh"

[[item.step]]
type = "apt"
packages = ["zsh", "git"]

[[item.step]]
type = "user_shell"
shell = "/usr/bin/zsh"

# Without a .zshrc, zsh opens its new-user menu at first login.
[[item.step]]
type = "run"
cmd = "touch ~/.zshrc"
as_user = true
creates = "~/.zshrc"

# The prompt chosen, into oh-my-zsh once it's cloned: Powerlevel10k (lean preset + yardo style in
# ~/.p10k.zsh, unless you have one) or Starship (mise; ~/.config/starship.toml
# unless you have one).
[[item]]
id = "prompt"
tab = "-"
label = "zsh prompt"
needs = ["zshcfg", "mise"]

[[item.step]]
type = "go:prompt"

# ~/.zshrc from zshrc.tmpl (.zshrc.orig kept), once oh-my-zsh and the
# prompt are in place: plugins are chosen at shell start from the installed
# tools; the theme is the chosen prompt's.
[[item]]
id = "zshrc"
tab = "-"
label = "~/.zshrc"
needs = ["zshcfg", "prompt"]

[[item.step]]
type = "go:zshrc"

[[item]]
id = "zshcfg"
tab = "-"
label = "zsh config: oh-my-zsh + autosuggestions, syntax highlighting, history search, completions"
needs = ["zshbin"]
source = "git clone ~/.oh-my-zsh + plugins · ~/.zshrc (.zshrc.orig kept)"

[[item.step]]
type = "git_clone"
repo = "https://github.com/ohmyzsh/ohmyzsh.git"
to = "~/.oh-my-zsh"

[[item.step]]
type = "git_clone"
repo = "https://github.com/joshskidmore/zsh-fzf-history-search.git"
to = "~/.oh-my-zsh/custom/plugins/zsh-fzf-history-search"

[[item.step]]
type = "git_clone"
repo = "https://github.com/zsh-users/zsh-autosuggestions.git"
to = "~/.oh-my-zsh/custom/plugins/zsh-autosuggestions"

[[item.step]]
type = "git_clone"
repo = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
to = "~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"

[[item.step]]
type = "file"
src = "completions.zsh"
to = "~/.config/yardo/completions.zsh"

[[item]]
id = "fzftab"
tab = "-"
label = "zsh fuzzy Tab completion (fzf-tab)"
needs = ["zshcfg", "cli"]
source = "git clone Aloxaf/fzf-tab → ~/.oh-my-zsh/custom/plugins"

[[item.step]]
type = "git_clone"
repo = "https://github.com/Aloxaf/fzf-tab.git"
to = "~/.oh-my-zsh/custom/plugins/fzf-tab"

[[item]]
id = "shellcfg"
tab = "-"
label = "Shell niceties for zsh and bash: z, fzf keys, direnv, eza/bat aliases"
source = "~/.config/yardo/shell.sh, sourced from .zshrc and .bashrc"

[[item.step]]
type = "file"
src = "shell.sh"
to = "~/.config/yardo/shell.sh"

[[item.step]]
type = "line"
to = "~/.bashrc"
line = '[ -r ~/.config/yardo/shell.sh ] && . ~/.config/yardo/shell.sh'

[[item.step]]
type = "line"
to = "~/.zshrc"
line = '[ -r ~/.config/yardo/shell.sh ] && . ~/.config/yardo/shell.sh'
if_exists = true

[[item]]
id = "cli"
tab = "-"
label = "CLI upgrades (ripgrep, fd, bat, eza, fzf, zoxide, delta, direnv)"
source = "apt install ripgrep fd-find bat eza zoxide fzf git-delta direnv tree (+ fd/bat links)"

[[item.step]]
type = "apt"
packages = ["ripgrep", "fd-find", "bat", "eza", "zoxide", "fzf", "git-delta", "direnv", "tree"]

# Ubuntu renames these two; link the usual names.
[[item.step]]
type = "link"
src = "/usr/bin/fdfind"
to = "/usr/local/bin/fd"

[[item.step]]
type = "link"
src = "/usr/bin/batcat"
to = "/usr/local/bin/bat"

[[item]]
id = "docs"
tab = "-"
label = "Man pages, completion, tldr"
source = "apt man-db manpages-dev bash-completion command-not-found plocate tealdeer · unminimize if needed"

# Minimal cloud images strip man pages and docs; unminimize restores them.
[[item.step]]
type = "run"
cmd = "{ DEBIAN_FRONTEND=noninteractive apt-get install -y -q unminimize || true; } && { ! command -v unminimize >/dev/null || yes | unminimize; }"
check = "test ! -e /etc/dpkg/dpkg.cfg.d/excludes"

[[item.step]]
type = "apt"
packages = ["man-db", "manpages-dev", "bash-completion", "command-not-found", "plocate", "tealdeer"]

[[item.step]]
type = "run"
cmd = "tldr --update || true"
as_user = true
creates = "~/.cache/tealdeer"
