# yardo catalog: the System tab.
# `legacy` steps run the bundled bash installer until the item is ported.

[[item]]
id = "etckeeper"
tab = "system"
label = "etckeeper (/etc history in git; install it first)"

[[item.step]]
type = "apt"
packages = ["etckeeper"]

[[item]]
id = "essentials"
tab = "system"
always = true
label = "Essentials (git, curl, jq, gh, build tools)"

[[item.step]]
type = "apt"
packages = ["git", "curl", "wget", "ca-certificates", "unzip", "zip", "build-essential", "jq", "gh"]

[[item]]
id = "debug"
tab = "system"
label = "Admin and debug tools (htop, btop, ncdu, duf, iotop, lsof, strace, tcpdump, mtr, dig, nmap, lnav, …)"
default = true
source = "apt install htop bind9-dnsutils mtr-tiny traceroute tcpdump iperf3 ethtool nmap iftop lsof strace ltrace sysstat iotop-c ncdu duf pv lnav netcat-openbsd socat rsync btop"

[[item.step]]
type = "apt"
packages = ["htop", "bind9-dnsutils", "mtr-tiny", "traceroute", "tcpdump", "iperf3", "ethtool", "nmap", "iftop", "lsof", "strace", "ltrace", "sysstat", "iotop-c", "ncdu", "duf", "pv", "lnav", "netcat-openbsd", "socat", "rsync", "btop"]

# sysstat ships disabled: without this, sar has no data.
[[item.step]]
type = "line"
to = "/etc/default/sysstat"
match = "^ENABLED="
line = 'ENABLED="true"'
if_exists = true

[[item.step]]
type = "systemctl"
unit = "sysstat"

[[item.step]]
type = "systemctl"
unit = "sysstat"
action = "restart"

[[item]]
id = "docker"
tab = "k8s"
scope = "system"
label = "Docker Engine + Compose, lazydocker, dive, hadolint, crane, cosign"
default = true
source = "apt docker-ce (download.docker.com repo) · log rotation, 10.200/16 networks · docker group = root"

[[item.step]]
type = "apt"
packages = ["ca-certificates", "curl"]

[[item.step]]
type = "apt_repo"
name = "docker"
key_url = "https://download.docker.com/linux/ubuntu/gpg"
key_fingerprint = "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
source = """
Types: deb
URIs: https://download.docker.com/linux/ubuntu
Suites: {{codename}}
Components: stable
Architectures: {{arch}}
Signed-By: {{keyring}}
"""

# Log rotation and address pools, before the engine first starts.
[[item.step]]
type = "go:docker_daemon"

[[item.step]]
type = "apt"
packages = ["docker-ce", "docker-ce-cli", "containerd.io", "docker-buildx-plugin", "docker-compose-plugin"]

[[item.step]]
type = "systemctl"
unit = "docker"

[[item.step]]
type = "run"
cmd = "usermod -aG docker {{user}}"
check = "id -nG {{user}} | tr ' ' '\\n' | grep -qx docker"
text = "{{user}} is now in the docker group: log in again (or run 'newgrp docker'). VS Code and Cursor remote servers keep the old groups until restarted: run 'Remote-SSH: Kill VS Code Server on Host' from the editor."

# Container tools: a TUI, image layers, Dockerfile lint, registries, signing.
[[item.step]]
type = "mise"
tools = ["lazydocker@latest", "dive@latest", "hadolint@latest", "crane@latest", "cosign@latest"]

[[item]]
id = "podman"
tab = "k8s"
scope = "system"
label = "Podman (rootless) + skopeo + buildah"

[[item.step]]
type = "apt"
packages = ["podman", "uidmap", "slirp4netns", "passt", "skopeo", "buildah"]

[[item]]
id = "tailscale-install"
tab = "system"
label = "Tailscale"
source = "curl tailscale.com/install.sh · log in under Configure → Logins & keys"

[[item.step]]
type = "run"
cmd = "curl -fsSL https://tailscale.com/install.sh | sh"
check = "command -v tailscale"
unverified = "Tailscale's own installer, which adds its signed apt repository"

# With the auth key typed this run; without one, `sudo tailscale up` later.
# Keeps the old id, so an old pick still means install + log in.
[[item]]
id = "tailscale"
tab = "logins"
scope = "system"
label = "Tailscale login (auth key; or 'sudo tailscale up' later)"
needs = ["tailscale-install"]
source = "tailscale up --auth-key"

[[item.step]]
type = "go:tailscale_up"

[[item]]
id = "netfs"
tab = "system"
label = "NFS + SMB clients"

[[item.step]]
type = "apt"
packages = ["nfs-common", "cifs-utils", "autofs"]

[[item]]
id = "openvpn-client"
tab = "system"
label = "OpenVPN client (connect this machine to a VPN)"
source = "apt openvpn · sudo openvpn --config <profile>.ovpn, or /etc/openvpn/client/<name>.conf + systemctl start openvpn-client@<name>"

[[item.step]]
type = "apt"
packages = ["openvpn"]

# The server: its own CA (easy-rsa), UDP 1194, clients on 10.8.0.0/24 with
# all their traffic sent through this machine (NAT), and a profile for the
# user in /srv/openvpn (root only: it holds the client's key).
[[item]]
id = "openvpn-server"
tab = "system"
label = "OpenVPN server (others connect to this machine; UDP 1194)"
source = "apt openvpn easy-rsa · /etc/openvpn/server · NAT 10.8.0.0/24 · profiles in /srv/openvpn: sudo yardo-vpn client <name>"

[[item.step]]
type = "apt"
packages = ["openvpn", "easy-rsa", "iptables"]

[[item.step]]
type = "file"
src = "yardo-vpn"
to = "/usr/local/sbin/yardo-vpn"
mode = "0755"

[[item.step]]
type = "run"
cmd = "/usr/local/sbin/yardo-vpn setup"
creates = "/etc/openvpn/server/tc.key"

[[item.step]]
type = "sysctl"
src = "sysctl-openvpn.conf"
to = "/etc/sysctl.d/62-yardo-openvpn.conf"

[[item.step]]
type = "file"
src = "yardo-vpn-nat.service"
to = "/etc/systemd/system/yardo-vpn-nat.service"

[[item.step]]
type = "file"
src = "openvpn-server.conf"
to = "/etc/openvpn/server/server.conf"

[[item.step]]
type = "systemctl"
action = "daemon-reload"

[[item.step]]
type = "systemctl"
unit = "yardo-vpn-nat"

[[item.step]]
type = "systemctl"
unit = "openvpn-server@server"

# A changed config (a newer yardo) takes effect.
[[item.step]]
type = "run"
cmd = "systemctl restart yardo-vpn-nat openvpn-server@server"
on_change = true

[[item.step]]
type = "run"
cmd = "/usr/local/sbin/yardo-vpn client {{user}} >/dev/null"
check = "test -f /srv/openvpn/{{user}}.ovpn"
text = "OpenVPN server: {{user}}'s profile is /srv/openvpn/{{user}}.ovpn (root only; copy it to your machine: ssh <this machine> sudo cat /srv/openvpn/{{user}}.ovpn > {{user}}.ovpn). Its \"remote\" is this machine's own address: change it if clients reach the machine another way (a public IP behind NAT, a DNS name), and open UDP 1194 in the cloud firewall. Another client: sudo yardo-vpn client <name>"

[[item]]
id = "devlimits"
tab = "sysconf"
scope = "system"
always = true
label = "Dev limits (inotify watches, open files, map count)"
source = "/etc/sysctl.d, limits.d, system.conf.d: 60-yardo.conf"

[[item.step]]
type = "file"
src = "sysctl-yardo.conf"
to = "/etc/sysctl.d/60-yardo.conf"

[[item.step]]
type = "file"
src = "limits-yardo.conf"
to = "/etc/security/limits.d/60-yardo.conf"

[[item.step]]
type = "file"
src = "systemd-yardo.conf"
to = "/etc/systemd/system.conf.d/60-yardo.conf"

[[item.step]]
type = "run"
cmd = "sysctl --system >/dev/null && systemctl daemon-reexec"
on_change = true

[[item]]
id = "zram"
tab = "sysconf"
scope = "system"
always = true
label = "Compressed swap in RAM (zram)"
source = "apt systemd-zram-generator · zram0 = half of RAM, max 8 GB"

[[item.step]]
type = "apt"
packages = ["systemd-zram-generator"]

[[item.step]]
type = "file"
src = "zram-generator.conf"
to = "/etc/systemd/zram-generator.conf"

[[item.step]]
type = "sysctl"
src = "sysctl-zram.conf"
to = "/etc/sysctl.d/61-zram.conf"

[[item.step]]
type = "systemctl"
action = "daemon-reload"

[[item.step]]
type = "systemctl"
unit = "systemd-zram-setup@zram0"
action = "restart"

[[item]]
id = "journald"
tab = "sysconf"
scope = "system"
always = true
label = "Journal capped at 200 MB"
source = "/etc/systemd/journald.conf.d/60-yardo.conf"

[[item.step]]
type = "file"
src = "journald-yardo.conf"
to = "/etc/systemd/journald.conf.d/60-yardo.conf"

[[item.step]]
type = "systemctl"
unit = "systemd-journald"
action = "restart"

[[item]]
id = "tzlocale"
tab = "sysconf"
scope = "system"
always = true
label = "Timezone + en_US.UTF-8 locale"
source = "timedatectl set-timezone · locale-gen · apt locales-all"

[[item.step]]
type = "go:timezone"

[[item.step]]
type = "apt"
packages = ["locales", "locales-all"]

[[item.step]]
type = "run"
cmd = "locale-gen en_US.UTF-8 && update-locale LANG=en_US.UTF-8"
check = "grep -qx 'LANG=en_US.UTF-8' /etc/default/locale && locale -a | grep -qix en_US.utf8"

[[item]]
id = "autoupdates"
tab = "sysconf"
scope = "system"
always = true
label = "Security updates (automatic, no reboot; quiet service restarts)"
source = "unattended-upgrades · needrestart restarts services without asking · /etc/yardo/auto-upgrades keeps updates on past a launcher's boot-time switch-off"

[[item.step]]
type = "apt"
packages = ["unattended-upgrades"]

[[item.step]]
type = "file"
src = "apt-20auto-upgrades"
to = "/etc/apt/apt.conf.d/20auto-upgrades"

[[item.step]]
type = "file"
src = "apt-52yardo"
to = "/etc/apt/apt.conf.d/52yardo"

# A launcher's cloud-init may turn the timers off at every boot unless this exists.
[[item.step]]
type = "run"
cmd = "install -d -m 0755 /etc/yardo && touch /etc/yardo/auto-upgrades"
creates = "/etc/yardo/auto-upgrades"

[[item.step]]
type = "systemctl"
unit = "apt-daily.timer"

[[item.step]]
type = "systemctl"
unit = "apt-daily-upgrade.timer"

[[item.step]]
type = "note"
text = "This VM's cloud-init turns automatic updates off at every boot (its launcher doesn't know /etc/yardo/auto-upgrades): after a reboot, run 'sudo yardo --yes' again."
when = "ud=/var/lib/cloud/instance/user-data.txt; [ -r $ud ] && grep -qF 'systemctl disable --now apt-daily.timer' $ud && ! grep -qF /etc/yardo/auto-upgrades $ud"

[[item.step]]
type = "apt"
packages = ["needrestart"]

[[item.step]]
type = "file"
src = "needrestart-yardo.conf"
to = "/etc/needrestart/conf.d/yardo.conf"

[[item]]
id = "sshharden"
tab = "sysconf"
scope = "system"
always = true
label = "SSH keys only (no passwords, no root login)"
source = "/etc/ssh/sshd_config.d/10-yardo.conf · skipped (with a note) while you have no authorized key"

# Skipped while the user has no SSH key; rolls back a config sshd rejects.
[[item.step]]
type = "go:sshharden"

# Only on a machine with a public IPv4: one behind NAT or on a LAN isn't
# brute-forced from the internet.
[[item]]
id = "fail2ban"
tab = "sysconf"
scope = "system"
always = true
label = "fail2ban (machines with a public IPv4)"
source = "apt fail2ban · sshd jail · Tailscale IPs never banned · only when an interface has a public IPv4"

[[item.step]]
type = "go:fail2ban"

