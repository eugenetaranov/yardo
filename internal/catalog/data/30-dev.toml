# yardo catalog: the Dev tools tab.
# `legacy` steps run the bundled bash installer until the item is ported.

[[item]]
id = "devcli"
tab = "dev"
label = "Dev CLIs and linters (just, Task, watchexec, xh, hurl, shellcheck, shfmt, actionlint, gitleaks, pre-commit, …)"
default = true

[[item.step]]
type = "mise"
tools = ["just@latest", "task@latest", "watchexec@latest", "hyperfine@latest", "xh@latest", "hurl@latest"]

# Linters and hooks.
[[item.step]]
type = "mise"
tools = ["shellcheck@latest", "shfmt@latest", "actionlint@latest", "gitleaks@latest", "uv@latest", "pipx:pre-commit"]

[[item]]
id = "dbclients"
tab = "dev"
label = "DB clients (psql, pgcli, usql, mariadb, sqlite3, redis-cli)"
default = true
source = "apt postgresql-client mariadb-client sqlite3 redis-tools · mise pgcli usql"

[[item.step]]
type = "apt"
packages = ["postgresql-client", "mariadb-client", "sqlite3", "redis-tools"]

[[item.step]]
type = "mise"
tools = ["uv@latest", "pipx:pgcli", "usql@latest"]

[[item]]
id = "jiractl"
tab = "dev"
label = "jiractl (Jira from the terminal: issues, saved JQL queries)"

[[item.step]]
type = "mise"
tools = ["github:eugenetaranov/jiractl@latest"]

[[item]]
id = "backup"
tab = "dev"
label = "restic + rclone (backups, cloud storage)"

[[item.step]]
type = "mise"
tools = ["restic@latest", "rclone@latest"]
