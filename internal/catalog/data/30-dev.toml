# yardo catalog: the Dev tools tab.
# `legacy` steps run the bundled bash installer until the item is ported.

[[item]]
id = "lazygit"
tab = "dev"
label = "lazygit (git TUI)"
default = true

[[item.step]]
type = "mise"
tools = ["lazygit@latest"]

[[item]]
id = "devcli"
tab = "dev"
label = "Dev CLIs (just, Task, watchexec, hyperfine, yq, xh, hurl)"
default = true

[[item.step]]
type = "mise"
tools = ["just@latest", "task@latest", "watchexec@latest", "hyperfine@latest", "yq@latest", "xh@latest", "hurl@latest"]

[[item]]
id = "lint"
tab = "dev"
label = "Linters + hooks (shellcheck, shfmt, actionlint, gitleaks, pre-commit)"
default = true

[[item.step]]
type = "mise"
tools = ["shellcheck@latest", "shfmt@latest", "actionlint@latest", "gitleaks@latest", "uv@latest", "pipx:pre-commit"]

[[item]]
id = "dbclients"
tab = "dev"
label = "DB clients (psql, pgcli, usql, mariadb, sqlite3, redis-cli)"
source = "apt postgresql-client mariadb-client sqlite3 redis-tools · mise pgcli usql"

[[item.step]]
type = "apt"
packages = ["postgresql-client", "mariadb-client", "sqlite3", "redis-tools"]

[[item.step]]
type = "mise"
tools = ["uv@latest", "pipx:pgcli", "usql@latest"]

[[item]]
id = "profiling"
tab = "dev"
label = "Profiling (perf, valgrind, bpftrace)"
source = "apt linux-tools-$(uname -r) valgrind bpftrace bpfcc-tools"

[[item.step]]
type = "apt"
packages = ["linux-tools-common", "linux-tools-{{kernel}}", "valgrind", "bpftrace", "bpfcc-tools"]

[[item]]
id = "act"
tab = "dev"
label = "act (run GitHub Actions locally)"
needs = ["docker"]

[[item.step]]
type = "mise"
tools = ["act@latest"]

[[item]]
id = "npmrc"
tab = "logins"
label = "Private npm registry (scope + token)"
needs = ["node"]
source = "~/.npmrc (a yardo block, 0600)"

[[item.step]]
type = "cred"
format = "npmrc"
to = "~/.npmrc"

[[item.step.key]]
name = "NPM_SCOPE"
prompt = "npm scope (e.g. @acme)"
answer = "npm.scope"

[[item.step.key]]
name = "NPM_REGISTRY"
prompt = "npm registry URL"
answer = "npm.registry"
default = "https://npm.pkg.github.com"

[[item.step.key]]
name = "NPM_TOKEN"
prompt = "npm registry token"
how = "for GitHub Packages: a token with read:packages at https://github.com/settings/tokens"

[[item.step]]
type = "note"
text = "npmrc: no npm scope set; run 'sudo yardo' and pick 'Private npm registry' again."
when = "[ -z {{npm_scope}} ]"

[[item]]
id = "autoupdate-tools"
tab = "sysconf"
label = "Weekly tool updates (mise up, krew upgrade; a systemd timer)"
needs = ["mise"]
source = "yardo-update@<user>.timer: weekly, as you · run now: sudo systemctl start yardo-update@<user>"

[[item.step]]
type = "file"
src = "yardo-update@.service"
to = "/etc/systemd/system/yardo-update@.service"

[[item.step]]
type = "file"
src = "yardo-update@.timer"
to = "/etc/systemd/system/yardo-update@.timer"

[[item.step]]
type = "run"
cmd = "systemctl daemon-reload && systemctl enable --now yardo-update@{{user}}.timer"
check = "systemctl is-enabled --quiet yardo-update@{{user}}.timer && systemctl is-active --quiet yardo-update@{{user}}.timer"

# glab, GitLab's CLI. Its SSH key and host: Configure → Git & SSH.
[[item]]
id = "gitlab-cli"
tab = "dev"
label = "glab (GitLab CLI)"

[[item.step]]
type = "mise"
tools = ["glab@latest"]
