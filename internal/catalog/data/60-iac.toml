# yardo catalog: the IaC tab.
# `legacy` steps run the bundled bash installer until the item is ported.

[[item]]
id = "terraform"
tab = "iac"
label = "Terraform + terragrunt, tflint, terraform-docs"

[[item.step]]
type = "mise"
tools = ["terraform@latest", "terragrunt@latest", "tflint@latest", "terraform-docs@latest"]

[[item]]
id = "opentofu"
tab = "iac"
label = "OpenTofu"

[[item.step]]
type = "mise"
tools = ["opentofu@latest"]

[[item]]
id = "iacscan"
tab = "iac"
label = "IaC and image scanners (trivy, checkov)"

[[item.step]]
type = "mise"
tools = ["trivy@latest", "uv@latest", "pipx:checkov"]

[[item]]
id = "packer"
tab = "iac"
label = "Packer"

[[item.step]]
type = "mise"
tools = ["packer@latest"]

[[item]]
id = "ansible"
tab = "iac"
label = "Ansible"

[[item.step]]
type = "mise"
tools = ["uv@latest", "pipx:ansible"]

[[item]]
id = "sops"
tab = "iac"
source = "mise use -g sops age · ~/.config/sops/age/keys.txt (0600) · SOPS_AGE_KEY_FILE"
label = "sops + age, with your age key (generate or paste)"

[[item.step]]
type = "mise"
tools = ["sops@latest", "age@latest"]

[[item.step]]
type = "go:agekey"

[[item.step]]
type = "line"
to = "~/.zshenv"
line = 'export SOPS_AGE_KEY_FILE="$HOME/.config/sops/age/keys.txt"'

[[item.step]]
type = "line"
to = "~/.bashrc"
line = 'export SOPS_AGE_KEY_FILE="$HOME/.config/sops/age/keys.txt"'
top = true

[[item]]
id = "vault"
tab = "iac"
label = "Vault CLI"

[[item.step]]
type = "mise"
tools = ["vault@latest"]
