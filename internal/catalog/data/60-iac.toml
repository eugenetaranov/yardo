# yardo catalog: the IaC tab.
# `legacy` steps run the bundled bash installer until the item is ported.

[[item]]
id = "terraform"
tab = "iac"
label = "Terraform + terragrunt, tflint, terraform-docs, checkov"

[[item.step]]
type = "mise"
tools = ["terraform@latest", "terragrunt@latest", "tflint@latest", "terraform-docs@latest", "uv@latest", "pipx:checkov"]

[[item]]
id = "opentofu"
tab = "iac"
label = "OpenTofu"

[[item.step]]
type = "mise"
tools = ["opentofu@latest"]

[[item]]
id = "packer"
tab = "iac"
label = "Packer"

[[item.step]]
type = "mise"
tools = ["packer@latest"]

[[item]]
id = "ansible"
tab = "iac"
label = "Ansible"

[[item.step]]
type = "mise"
tools = ["uv@latest", "pipx:ansible"]

[[item]]
id = "tack"
tab = "iac"
label = "tack (Ansible-like config management, one binary)"

[[item.step]]
type = "mise"
tools = ["github:tackhq/tack@latest"]

[[item]]
id = "sops-install"
tab = "iac"
label = "sops + age (your age key: Configure → Logins & keys)"

[[item.step]]
type = "mise"
tools = ["sops@latest", "age@latest"]

# Keeps the old id, so an old pick still means install + key.
[[item]]
id = "sops"
tab = "logins"
needs = ["sops-install"]
source = "~/.config/sops/age/keys.txt (0600) · SOPS_AGE_KEY_FILE"
label = "age key for sops (generate or paste)"

[[item.step]]
type = "go:agekey"

[[item.step]]
type = "line"
to = "~/.zshenv"
line = 'export SOPS_AGE_KEY_FILE="$HOME/.config/sops/age/keys.txt"'

[[item.step]]
type = "line"
to = "~/.bashrc"
line = 'export SOPS_AGE_KEY_FILE="$HOME/.config/sops/age/keys.txt"'
top = true

[[item]]
id = "vault"
tab = "iac"
label = "Vault CLI"

[[item.step]]
type = "mise"
tools = ["vault@latest"]
