# Community skills shipped in yardo (internal/assets/conf/skills/<name>),
# each a folder from its repo at a pinned commit, with the repo's licence.
# Nothing is fetched on a VM: an update is a reviewed commit made with
#   scripts/update-skills [--latest] [NAME...]
# sha256 is the vendored folder's hash (as the skills step's treeHash);
# a test checks it, so a hand edit to a vendored skill shows.

