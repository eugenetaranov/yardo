# yardo's OpenVPN server (yardo rewrites this file; run yardo-vpn for
# client profiles). UDP 1194, clients get 10.8.0.0/24 and send all their
# traffic through this machine.
port 1194
proto udp
dev tun
topology subnet
server 10.8.0.0 255.255.255.0

ca pki/ca.crt
cert pki/issued/server.crt
key pki/private/server.key
dh none
ecdh-curve prime256v1
tls-crypt tc.key
crl-verify crl.pem
tls-version-min 1.2
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
auth SHA256

push "redirect-gateway def1 bypass-dhcp"
push "dhcp-option DNS 1.1.1.1"
push "dhcp-option DNS 9.9.9.9"

keepalive 10 120
user nobody
group nogroup
persist-key
persist-tun
verb 3
