# yardo's Starship prompt: one line, the essentials. Yours to change
# (yardo writes this file only when there is none). Presets and options:
# https://starship.rs/config/
add_newline = false
command_timeout = 1000

format = "$username$hostname$directory$git_branch$git_status$kubernetes$aws$python$nodejs$golang$rust$cmd_duration$character"

[username]
show_always = false

[hostname]
ssh_only = true
format = "[$hostname]($style) "

[directory]
truncation_length = 3
truncate_to_repo = true

[cmd_duration]
min_time = 3_000

[kubernetes]
disabled = false
format = '[⎈ $context](cyan) '
