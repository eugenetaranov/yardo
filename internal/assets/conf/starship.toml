# yardo's Starship prompt: one line, the essentials, in this machine's
# accent colour. yardo rewrites this file while its first line is this
# one (when you change the accent); change that line and the file is yours
# to edit, and yardo leaves it alone. Presets and options:
# https://starship.rs/config/
add_newline = false
command_timeout = 1000

format = "$username$hostname$directory$git_branch$git_status$kubernetes$aws$python$nodejs$golang$rust$cmd_duration$character"

[username]
show_always = false

[hostname]
ssh_only = true
style = "bold {{ .accent }}"
format = "[$hostname]($style) "

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold {{ .accent }}"

[character]
success_symbol = "[❯](bold {{ .accent }})"

[cmd_duration]
min_time = 3_000

[kubernetes]
disabled = false
format = '[⎈ $context](cyan) '
