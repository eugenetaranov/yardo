# Written by yardo ("tmux config"); your previous file is ~/.tmux.conf.orig.
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Splits and new windows open in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# The status bar and the active pane's border in your accent colour (sudo
# yardo → This VM → Accent colour), to tell this machine's tmux apart.
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[fg=colour234,bg={{ .accent }},bold] #h #[default] "
set -g status-left-length 30
set -g status-right "#[fg={{ .accent }}]%H:%M "
set -g window-status-current-style "fg={{ .accent }},bold"
set -g pane-active-border-style "fg={{ .accent }}"
set -g message-style "fg=colour234,bg={{ .accent }}"

# prefix + r reloads this file.
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Your own settings go in ~/.tmux.local.conf: yardo never writes it.
source-file -q ~/.tmux.local.conf
