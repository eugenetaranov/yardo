name: Refresh mise registry

# yardo's picker searches mise's registry. Machines fetch this file from
# main (cached for a week), so new mise tools show up without a release.
on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise (latest)
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Regenerate the snapshot
        run: mise registry -J --hide-aliased | python3 internal/assets/picker.py --registry-tsv > internal/assets/mise-registry.tsv

      - name: Commit when it changed
        run: |
          if git diff --quiet internal/assets/mise-registry.tsv; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(assets): refresh mise registry snapshot" internal/assets/mise-registry.tsv
          git push
