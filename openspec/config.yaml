schema: spec-driven

context: |
  yardo is a single static Go binary that sets up a Linux machine (a VM
  or a server, Ubuntu/Debian) for development: a terminal UI (home,
  Tools, Settings, MCP servers) over a catalog of items it installs,
  configures, checks and uninstalls, run as `sudo yardo` on the machine.

  Tech stack:
    - Go (pure Go, no CGo), linux amd64 and arm64 only
    - Bubble Tea, Bubbles, Lip Gloss and huh for the TUI
    - BurntSushi/toml for the catalog and profiles, yaml.v3
    - the catalog in internal/catalog/data/*.toml, config files and
      MCP server specs embedded from internal/assets
    - Taskfile (task build, test, lint, release), golangci-lint
    - GoReleaser v2; install.sh from the release, checksums checked;
      Homebrew tap at eugenetaranov/homebrew-tap

  Conventions:
    - cmd/yardo holds the CLI; everything else lives under internal/.
    - State lives under /var/lib/yardo (answers.json, per-user state);
      secrets never go there, only into each tool's own config file.
    - Every command and its output goes to /var/log/yardo.log.
    - Workflow files are .yaml, not .yml.
    - README and UI text: short plain sentences, the user's words, no
      jargon; screens say what something does, not how.

rules:
  proposal:
    - "Keep proposals tight: ## Why, ## What Changes, ## Capabilities, ## Impact."
  specs:
    - "Use OpenSpec scenario format: '### Requirement:' followed by '#### Scenario:' with WHEN/THEN bullets."
